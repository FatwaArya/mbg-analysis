name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/**"
      - "analysis/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy dashboard, scripts, and analysis to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dashboard/,scripts/,analysis/"
          target: "/opt/mbg/"

      - name: Set permissions and restart dashboard
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/mbg
            # Remove any old pipeline scripts that may have been re-uploaded
            rm -f scripts/run_pipeline.sh
            chmod +x scripts/*.sh scripts/*.py analysis/*.py
            echo 'dashboard_password = "${{ secrets.DASHBOARD_PASSWORD }}"' > /opt/mbg/dashboard/.streamlit/secrets.toml
            systemctl restart mbg-dashboard
            systemctl status mbg-dashboard --no-pager | head -5
