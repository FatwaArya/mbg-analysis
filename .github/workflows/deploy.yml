name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/mbg
            # Pull latest dashboard files via git (or rsync via scp below)
            # We use inline file update approach since repo is private
            echo "Deploy triggered"

      - name: Copy dashboard files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dashboard/"
          target: "/opt/mbg/"

      - name: Restart dashboard service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo 'dashboard_password = "${{ secrets.DASHBOARD_PASSWORD }}"' > /opt/mbg/dashboard/.streamlit/secrets.toml
            systemctl restart mbg-dashboard
            systemctl status mbg-dashboard --no-pager | head -5
